name: Build ShadowExtender

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Show gitmodules
        run: cat .gitmodules

      - name: Verify aml-psdk
        run: |
          ls -la
          ls -la aml-psdk
          find aml-psdk -name "plugin.h"

      # NOTE: this repo's own submodule only covers aml-psdk/. The ./mod/
      # folder (AML loader headers: amlmod.h, iaml.h, interface.h) must
      # also be present -- either committed directly to this repo, or
      # fetched here as its own step/submodule once its source location
      # is confirmed. Until then this workflow assumes mod/ is committed.

      - name: Verify mod/ folder
        run: |
          ls -la mod
          test -f mod/amlmod.h || { echo "::error::mod/amlmod.h missing -- did you commit and push the mod/ folder?"; exit 1; }
          test -f mod/iaml.h || { echo "::error::mod/iaml.h missing -- did you commit and push the mod/ folder?"; exit 1; }

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true

      - name: Build with ndk-build
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Debug submodule contents (only runs if build above failed)
        if: failure()
        run: |
          echo "--- git submodule status ---"
          git submodule status
          echo "--- aml-psdk top level ---"
          ls -la aml-psdk
          echo "--- looking for plugin.h ---"
          find aml-psdk -iname "plugin.h"

      - name: Upload compiled .so files
        uses: actions/upload-artifact@v4
        with:
          name: ShadowExtender-so
          path: libs/**/*.so
          if-no-files-found: error
          
