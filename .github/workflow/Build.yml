name: Build ShadowExtender

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      # Fetched explicitly rather than relying on .gitmodules being wired
      # up correctly on the submitting side -- guarantees aml-psdk/ is
      # actually populated regardless of local git setup.
      - name: Check out aml-psdk into ./aml-psdk
        uses: actions/checkout@v4
        with:
          repository: AndroidModLoader/aml-psdk
          path: aml-psdk

      - name: Verify required folders are present
        run: |
          test -f aml-psdk/game_sa/plugin.h || { echo "::error::aml-psdk/game_sa/plugin.h missing after checkout"; exit 1; }
          test -f mod/amlmod.h || { echo "::error::mod/amlmod.h missing -- this repo must commit its own mod/ folder (AML loader headers: amlmod.h, iaml.h, interface.h) since it isn't fetched automatically. See README."; exit 1; }
          test -f mod/iaml.h || { echo "::error::mod/iaml.h missing -- see mod/amlmod.h error above."; exit 1; }
          echo "All required headers present."

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r29
          add-to-path: true

      - name: Build with ndk-build
        run: |
          $ANDROID_NDK_HOME/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=./Android.mk \
            NDK_APPLICATION_MK=./Application.mk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload compiled .so files
        uses: actions/upload-artifact@v4
        with:
          name: ShadowExtender-so
          path: libs/**/*.so
          if-no-files-found: error
