; ShadowExtender.ini
; Place at: /sdcard/Android/data/com.rockstargames.gtasa/files/ShadowExtender.ini

[General]
Enabled=1

[Targets]
; Trees/vegetation are handled via the engine's own (stub) tree-shadow
; hook. Small objects and buildings are not yet supported -- see the
; scope note at the top of main.cpp.
ShadowTrees=1

[Render]
; Shadow brightness/intensity, 0-255 (maps to CShadows' Brightness param).
Opacity=180
; Multiplier applied to BaseRadius to size each tree's shadow blob.
SizeScale=1.0
; Base shadow radius in world units before SizeScale is applied.
BaseRadius=3.0
; Fixed shadow-spread direction (front/side vectors). No live sun-direction
; source has been confirmed in the SDK yet, so this is static for now --
; pick values roughly matching your preferred time-of-day lighting angle.
DirFrontX=0.7
DirFrontY=0.7
DirSideX=-0.7
DirSideY=0.7

[Models]
; Comma-separated model IDs to always exclude (e.g. a tree model with a
; broken collision bound that produces a distorted shadow).
Blacklist=
